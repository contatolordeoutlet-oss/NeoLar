<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeoLar — Eletrônicos e Decoração para sua casa</title>
  <meta name="description" content="NeoLar: eletrônicos e itens de decoração selecionados para deixar sua casa mais bonita e conectada." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="logo"><span class="dot"></span> NeoLar</div>
      <nav class="main-nav">
        <button class="active" data-category="todos">Todos</button>
        <button data-category="eletronicos">Eletrônicos</button>
        <button data-category="decoracao">Decoração</button>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <div class="hero-track" id="heroTrack"></div>
      <div class="hero-nav">
        <button id="heroPrev" aria-label="Produto anterior">‹</button>
        <button id="heroNext" aria-label="Próximo produto">›</button>
      </div>
      <div class="hero-dots" id="heroDots"></div>
    </section>

    <div class="section-heading">
      <h3>Produtos</h3>
      <span id="gridCount"></span>
    </div>

    <section class="product-grid" id="productGrid"></section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> NeoLar</span>
      <span>Os links de compra são de afiliados — ao comprar por eles, você apoia o site sem pagar nada a mais.</span>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
